name: CI/CD Norvia

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restaurar paquetes NuGet
        run: dotnet restore backend/Norvia.slnx

      - name: Compilar
        run: dotnet build backend/Norvia.slnx --no-restore

      - name: Correr pruebas (Testcontainers)
        run: dotnet test backend/Norvia.slnx --no-build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restaurar paquetes NuGet
        run: dotnet restore Norvia.slnx

      - name: Instalar dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Aplicar migraciones
        run: dotnet ef database update -p Norvia.Infrastructure -s Norvia.API
        env:
          ConnectionStrings__PostgresConnection: ${{ secrets.ConnectionStrings__PostgresConnection }}

      - name: Disparar despliegue en Render (backend)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}