# infra/docker-compose.yml
# Nombre fijo del proyecto: sin él, Compose usa el nombre de la carpeta ("infra")
# y el volumen choca con el de otros proyectos que también tengan una carpeta infra/.
name: norvia
services:
  db-norvia:
    image: postgres:16-alpine
    container_name: postgres-norvia
    env_file:
      - .env # Inyecta las variables exclusivas del contenedor
    ports:
      - "5433:5432" # host:contenedor (Postgres escucha en 5432 dentro)
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
